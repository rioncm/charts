namespace: gprox

nameOverride: ""
fullnameOverride: ""

replicaCount: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: null

image:
  repository: ghcr.io/pminc/gprox
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8888
  annotations: {}
  labels: {}
  nodePort: null

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
  hosts:
    - host: gprox.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gprox-tls
      hosts:
        - gprox.example.com

secrets:
  config:
    existingSecret: ""
    key: config.yaml
    mountPath: /etc/gprox
  gcloud:
    existingSecret: ""
    key: google.json
    mountPath: /etc/gprox

env: []
extraEnvFrom: []
extraVolumeMounts: []
extraVolumes: []

affinity: {}
nodeSelector: {}
tolerations: []
priorityClassName: ""

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

noControlPlane: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 5
  timeoutSeconds: 3
  periodSeconds: 10
  failureThreshold: 3

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

terminationGracePeriodSeconds: 30
